name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Optional Authenticode (Azure Trusted Signing) — enable when secrets exist.
      # Without this, GitHub .exe downloads often trip cloud ML (Wacatac) on small Tauri NSIS.
      # Required secrets (example): AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #   AZURE_CODE_SIGNING_ACCOUNT_NAME, AZURE_CERT_PROFILE_NAME, AZURE_ENDPOINT
      # Docs: https://learn.microsoft.com/en-us/azure/trusted-signing/
      # Do NOT add unsigned fake PFX. Leave this commented until credentials are ready.
      #
      # - name: Azure Trusted Signing (optional)
      #   if: ${{ secrets.AZURE_TENANT_ID != '' }}
      #   uses: azure/trusted-signing-action@v0
      #   with: ...

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: bake default API URL into the installer (https://chat.example.com)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          tagName: v__VERSION__
          releaseName: "Aegis v__VERSION__"
          releaseBody: |
            ## Εγκατάσταση (Windows) — LAN πρώτα

            **Μην κατεβάζεις το Setup από GitHub** αν ο browser δείχνει virus (Wacatac ML false positive).

            ### Προτεινόμενο (παρέα στο ίδιο LAN)
            Άνοιξε **http://192.168.1.235:8080/** και κατέβασε:
            - **`Aegis_latest_x64-setup.exe`** (προτεινόμενο — τοπικό Defender καθαρό)
            - ή `Aegis_latest_windows_x64.zip` → unzip → `Aegis.exe`

            Server URL: `http://192.168.1.235:3001`

            Οδηγίες: `INSTALL-WINDOWS.md`

            ### Portable zip (αυτό το Release)
            `Aegis_*_windows_x64.zip` — secondary· προτίμησε LAN αν υπάρχει block.

            ## Updates
            Από LAN: `http://192.168.1.235:8080/latest.json` (setup στο ίδιο host).
            Μετά από κάθε release: `.\scripts\publish-downloads-to-vm.ps1 -RemoveNsisFromGitHub`

            ## Signing
            Χωρίς Authenticode / Azure Trusted Signing, internet GitHub .exe downloads
            θα συνεχίσουν να false-positive. Το LAN είναι η σωστή διανομή για την παρέα.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload portable zip (non-NSIS)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          $exe = "src-tauri/target/release/aegis.exe"
          if (-not (Test-Path $exe)) {
            throw "Missing $exe — tauri build did not produce the release binary"
          }
          $stage = Join-Path $env:RUNNER_TEMP "aegis-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "Aegis.exe")
          $zipName = "Aegis_${ver}_windows_x64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Portable zip: $zipPath ($([math]::Round((Get-Item $zipPath).Length/1MB, 2)) MB)"
          gh release upload $tag $zipPath --clobber
          Write-Host "Uploaded $zipName to $tag"

      # Keep NSIS on the release long enough for publish-downloads-to-vm.ps1 to fetch it.
      # After LAN publish, run: .\scripts\publish-downloads-to-vm.ps1 -RemoveNsisFromGitHub
      # (strips setup + GitHub latest.json so friends are not steered to cloud-flagged assets)
      - name: Reminder — publish to LAN VM
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "CI done. From admin PC run:"
          Write-Host "  .\scripts\publish-downloads-to-vm.ps1 -Tag v$ver -RemoveNsisFromGitHub"
          Write-Host "Friends install from http://192.168.1.235:8080/"
