# LAN / private-IP deploy (no public domain / Let's Encrypt).
# Use when the VM is on your home/lab network, e.g. http://192.168.1.235:3001
#
#   cp .env.example .env   # set secrets (DOMAIN not required)
#   docker compose -f docker-compose.lan.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    volumes:
      - aegis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - aegis_net

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aegis}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://tauri.localhost,https://tauri.localhost,tauri://localhost,http://localhost:8765,http://127.0.0.1:8765}
      ACCESS_TTL_SEC: ${ACCESS_TTL_SEC:-900}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      UPLOAD_DIR: /data/uploads
      # 2GB default (aligned with Windows client hard-block)
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      RUN_SEED: ${RUN_SEED:-0}
      # Optional: Pterodactyl panel — Client API key for game start/stop
      PTERODACTYL_URL: ${PTERODACTYL_URL:-}
      PTERODACTYL_CLIENT_KEY: ${PTERODACTYL_CLIENT_KEY:-}
    volumes:
      - aegis_uploads:/data/uploads
    networks:
      - aegis_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Static LAN downloads (zip / setup / latest.json) — primary install path for friends.
  # Avoids GitHub SmartScreen / cloud ML false positives on small Tauri NSIS.
  # Browse: http://192.168.1.235:8080/
  downloads:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../downloads:/usr/share/nginx/html:ro
      - ./downloads.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aegis_net

networks:
  aegis_net:

volumes:
  aegis_pg:
  aegis_uploads:
